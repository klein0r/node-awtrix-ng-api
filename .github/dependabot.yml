version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - 'klein0r'
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 removed moduleResolution Node10, which tsconfig.cjs.json relies on.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep the Node.js types in step with the supported runtime (engines: node >= 22).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    assignees:
      - 'klein0r'
